name: CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -c requirements/cpu.txt -e .
      - run: python -m pip check
      - run: python tools/check_repository.py
      - run: python -c "import slimkv; import slimkv.llama3; import slimkv.qwen2; import main.eval_longbench"
      - run: python -m unittest discover -s tests -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
      - run: python -m main.infer --help
      - run: git diff --check
